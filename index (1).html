<script>
const L1=[
["大家好！我叫李文，我是中国人，我和白家月是同学，很高兴认识你们。","Dàjiā hǎo! Wǒ jiào Lǐ Wén, wǒ shì Zhōngguó rén, wǒ hé Bái Jiāyuè shì tóngxué, hěn gāoxìng rènshi nǐmen.","Chào mọi người! Mình tên là Lý Văn, mình là người Trung Quốc, mình và Bạch Gia Nguyệt là bạn học, rất vui được quen các bạn."],
["请问，你叫什么名字？你是法国人吗？不是，我是泰国人，我叫陈天中。","Qǐngwèn, nǐ jiào shénme míngzi? Nǐ shì Fǎguó rén ma? Bú shì, wǒ shì Tàiguó rén, wǒ jiào Chén Tiānzhōng.","Xin hỏi, bạn tên là gì? Bạn là người Pháp phải không? Không phải, mình là người Thái Lan, mình tên là Trần Thiên Trung."],
["对不起，王老师，我今天太忙了，没看见您。没关系，下午两点见吧！","Duìbuqǐ, Wáng lǎoshī, wǒ jīntiān tài máng le, méi kànjiàn nín. Méi guānxi, xiàwǔ liǎng diǎn jiàn ba!","Xin lỗi cô Vương, hôm nay em bận quá nên không thấy cô. Không sao, 2 giờ chiều gặp nhau nhé!"],
["我家有五口人：爸爸、妈妈、哥哥、妹妹和我。我哥哥今年二十五岁，我妹妹今年十二岁。","Wǒ jiā yǒu wǔ kǒu rén: bàba, māma, gēge, mèimei hé wǒ. Wǒ gēge jīnnián èrshíwǔ suì, wǒ mèimei jīnnián shí'èr suì.","Nhà tôi có 5 người: bố, mẹ, anh trai, em gái và tôi. Anh trai tôi năm nay 25 tuổi, em gái tôi năm nay 12 tuổi."],
["刘明是医生，他有两个孩子：儿子今年五岁，女儿今年十二岁，女儿是学生。","Liú Míng shì yīshēng, tā yǒu liǎng gè háizi: érzi jīnnián wǔ suì, nǚ'ér jīnnián shí'èr suì, nǚ'ér shì xuésheng.","Lưu Minh là bác sĩ, anh ấy có hai đứa con: con trai năm nay 5 tuổi, con gái năm nay 12 tuổi, con gái là học sinh."],
["我爸爸也在医院工作，他是医生，病人很多，他太忙了，今天不能休息。","Wǒ bàba yě zài yīyuàn gōngzuò, tā shì yīshēng, bìngrén hěn duō, tā tài máng le, jīntiān bù néng xiūxi.","Bố tôi cũng làm việc ở bệnh viện, ông là bác sĩ, bệnh nhân rất đông, ông bận quá, hôm nay không thể nghỉ ngơi."],
["今天是十月十一号，星期天，我不上班，在家休息。我会做饭，今天想做饺子和一些菜。","Jīntiān shì shí yuè shíyī hào, xīngqītiān, wǒ bú shàngbān, zài jiā xiūxi. Wǒ huì zuò fàn, jīntiān xiǎng zuò jiǎozi hé yīxiē cài.","Hôm nay là ngày 11 tháng 10, chủ nhật, tôi không đi làm, ở nhà nghỉ ngơi. Tôi biết nấu ăn, hôm nay muốn làm há cảo và vài món nữa."],
["明天我不上班，上午想去超市买一些菜和牛奶，下午去书店买一本书。","Míngtiān wǒ bú shàngbān, shàngwǔ xiǎng qù chāoshì mǎi yīxiē cài hé niúnǎi, xiàwǔ qù shūdiàn mǎi yì běn shū.","Ngày mai tôi không đi làm, buổi sáng muốn đi siêu thị mua một ít rau và sữa bò, buổi chiều đi tiệm sách mua một cuốn sách."],
["家月，你的新手机真好看！你的手机号是多少？我明天上午给你打电话，好吗？","Jiāyuè, nǐ de xīn shǒujī zhēn hǎokàn! Nǐ de shǒujī hào shì duōshǎo? Wǒ míngtiān shàngwǔ gěi nǐ dǎ diànhuà, hǎo ma?","Gia Nguyệt, điện thoại mới của bạn đẹp thật! Số điện thoại của bạn là bao nhiêu? Sáng mai mình gọi điện cho bạn, được không?"],
["我晚上六点半下班，下班后我坐出租车去西安饭店吃晚饭，西安饭店的米饭非常好吃。","Wǒ wǎnshang liù diǎn bàn xiàbān, xiàbān hòu wǒ zuò chūzūchē qù Xī'ān Fàndiàn chī wǎnfàn, Xī'ān Fàndiàn de mǐfàn fēicháng hǎochī.","6 rưỡi tối tôi tan ca, sau khi tan ca tôi đi taxi đến nhà hàng Tây An ăn tối, cơm ở nhà hàng Tây An ngon vô cùng."],
["你怎么去学校？我坐出租车去，二十分钟后到。我们在学校前边见吧！","Nǐ zěnme qù xuéxiào? Wǒ zuò chūzūchē qù, èrshí fēnzhōng hòu dào. Wǒmen zài xuéxiào qiánbian jiàn ba!","Bạn đến trường bằng cách nào? Mình đi taxi, 20 phút nữa là đến. Chúng ta gặp nhau ở phía trước trường nhé!"],
["我明天上午在学校学习中文，下午和朋友去电影院看电影。","Wǒ míngtiān shàngwǔ zài xuéxiào xuéxí Zhōngwén, xiàwǔ hé péngyou qù diànyǐngyuàn kàn diànyǐng.","Sáng mai tôi học tiếng Trung ở trường, buổi chiều cùng bạn đi rạp chiếu phim xem phim."],
["我们中文课上午八点上课，十点十分下课，下课后我想在学校前边的书店读书。","Wǒmen Zhōngwén kè shàngwǔ bā diǎn shàngkè, shí diǎn shí fēn xiàkè, xiàkè hòu wǒ xiǎng zài xuéxiào qiánbian de shūdiàn dúshū.","Lớp tiếng Trung của chúng tôi 8 giờ sáng vào học, 10 giờ 10 phút tan học, sau giờ học tôi muốn đọc sách ở tiệm sách phía trước trường."],
["我的房间不大，桌子上有一个新电脑，桌子下有一只小猫，椅子上有一本书。","Wǒ de fángjiān bú dà, zhuōzi shàng yǒu yí gè xīn diànnǎo, zhuōzi xià yǒu yì zhī xiǎomāo, yǐzi shàng yǒu yì běn shū.","Phòng của tôi không lớn, trên bàn có một cái máy tính mới, dưới bàn có một chú mèo nhỏ, trên ghế có một cuốn sách."],
["你看见我的小猫了吗？我没看见它。它不在房间里，在外边吗？","Nǐ kànjiàn wǒ de xiǎomāo le ma? Wǒ méi kànjiàn tā. Tā bú zài fángjiān lǐ, zài wàibian ma?","Bạn có nhìn thấy chú mèo nhỏ của tôi không? Tôi không thấy nó. Nó không ở trong phòng, ở bên ngoài à?"],
["这是我女朋友，她是法国人，很漂亮，也很喜欢唱歌。她唱的歌真好听！","Zhè shì wǒ nǚ péngyou, tā shì Fǎguó rén, hěn piàoliang, yě hěn xǐhuan chàng gē. Tā chàng de gē zhēn hǎotīng!","Đây là bạn gái tôi, cô ấy là người Pháp, rất xinh đẹp, cũng rất thích hát. Bài cô ấy hát nghe thật hay!"],
["白天我在学校学习，晚上我喜欢在家看电视，我的小狗在椅子下玩。","Báitiān wǒ zài xuéxiào xuéxí, wǎnshang wǒ xǐhuan zài jiā kàn diànshì, wǒ de xiǎo gǒu zài yǐzi xià wán.","Ban ngày tôi học ở trường, buổi tối tôi thích ở nhà xem tivi, chú chó nhỏ của tôi chơi dưới ghế."],
["王老师有二十个学生，有法国人，也有泰国人。学生们说：“谢谢您，老师！”老师说：“不客气，再见！”","Wáng lǎoshī yǒu èrshí gè xuésheng, yǒu Fǎguó rén, yě yǒu Tàiguó rén. Xuéshengmen shuō: “Xièxie nín, lǎoshī!” Lǎoshī shuō: “Bú kèqi, zàijiàn!”","Cô Vương có 20 học sinh, có người Pháp, cũng có người Thái. Các học sinh nói: “Cảm ơn cô ạ!” Cô nói: “Đừng khách sáo, tạm biệt!”"],
["你有哥哥吗？没有，我有一个姐姐和一个妹妹。你姐姐今年多大？她今年三十岁，在医院工作。","Nǐ yǒu gēge ma? Méiyǒu, wǒ yǒu yí gè jiějie hé yí gè mèimei. Nǐ jiějie jīnnián duō dà? Tā jīnnián sānshí suì, zài yīyuàn gōngzuò.","Bạn có anh trai không? Không có, tôi có một chị gái và một em gái. Chị bạn năm nay bao nhiêu tuổi? Chị ấy năm nay 30 tuổi, làm việc ở bệnh viện."],
["她是谁？她是我的同学白家月。她是哪国人？她是法国人，她的中文很好。","Tā shì shéi? Tā shì wǒ de tóngxué Bái Jiāyuè. Tā shì nǎ guó rén? Tā shì Fǎguó rén, tā de Zhōngwén hěn hǎo.","Cô ấy là ai? Cô ấy là bạn học của tôi, Bạch Gia Nguyệt. Cô ấy là người nước nào? Cô ấy là người Pháp, tiếng Trung của cô ấy rất tốt."]
];
const L2=[
["我叫李文，是北京人，今年二十岁。现在我在学校学习，我的同学有法国人，也有泰国人，我们是好朋友。","Wǒ jiào Lǐ Wén, shì Běijīng rén, jīnnián èrshí suì. Xiànzài wǒ zài xuéxiào xuéxí, wǒ de tóngxué yǒu Fǎguó rén, yě yǒu Tàiguó rén, wǒmen shì hǎo péngyou.","Tôi tên Lý Văn, là người Bắc Kinh, năm nay 20 tuổi. Bây giờ tôi học ở trường, bạn học của tôi có người Pháp, cũng có người Thái, chúng tôi là bạn tốt."],
["我妈妈五十五岁，她不上班，在家休息。她会做饭，做的面条儿和饺子非常好吃，我们一家人很喜欢吃。","Wǒ māma wǔshíwǔ suì, tā bú shàngbān, zài jiā xiūxi. Tā huì zuò fàn, zuò de miàntiáo hé jiǎozi fēicháng hǎochī, wǒmen yì jiā rén hěn xǐhuan chī.","Mẹ tôi 55 tuổi, bà không đi làm, ở nhà nghỉ ngơi. Bà biết nấu ăn, mì và há cảo bà làm ngon vô cùng, cả nhà chúng tôi rất thích ăn."],
["现在是下午三点二十分，我想去超市买一些牛奶和菜，买东西后，我想坐出租车去医院看我爸爸。","Xiànzài shì xiàwǔ sān diǎn èrshí fēn, wǒ xiǎng qù chāoshì mǎi yīxiē niúnǎi hé cài, mǎi dōngxi hòu, wǒ xiǎng zuò chūzūchē qù yīyuàn kàn wǒ bàba.","Bây giờ là 3 giờ 20 chiều, tôi muốn đi siêu thị mua một ít sữa bò và rau, sau khi mua đồ tôi muốn đi taxi đến bệnh viện thăm bố tôi."],
["星期六上午我没有课，想在家看电视，下午和朋友去公园玩，晚上去电影院看电影，你想去吗？","Xīngqīliù shàngwǔ wǒ méiyǒu kè, xiǎng zài jiā kàn diànshì, xiàwǔ hé péngyou qù gōngyuán wán, wǎnshang qù diànyǐngyuàn kàn diànyǐng, nǐ xiǎng qù ma?","Sáng thứ bảy tôi không có tiết học, muốn ở nhà xem tivi, buổi chiều cùng bạn đi công viên chơi, buổi tối đi rạp xem phim, bạn có muốn đi không?"],
["学校前边有一家书店，书店很大，书店里有很多书，也有漂亮的桌子和椅子，我下课后喜欢去那边读书。","Xuéxiào qiánbian yǒu yì jiā shūdiàn, shūdiàn hěn dà, shūdiàn lǐ yǒu hěn duō shū, yě yǒu piàoliang de zhuōzi hé yǐzi, wǒ xiàkè hòu xǐhuan qù nàbiān dúshū.","Phía trước trường có một tiệm sách, tiệm sách rất lớn, trong tiệm có rất nhiều sách, cũng có bàn ghế đẹp, sau giờ học tôi thích đến đằng đó đọc sách."],
["我有一只小狗和一只小猫，小狗三岁，小猫两岁，它们很漂亮。小狗喜欢玩，小猫喜欢在椅子上休息。","Wǒ yǒu yì zhī xiǎo gǒu hé yì zhī xiǎomāo, xiǎo gǒu sān suì, xiǎomāo liǎng suì, tāmen hěn piàoliang. Xiǎo gǒu xǐhuan wán, xiǎomāo xǐhuan zài yǐzi shàng xiūxi.","Tôi có một chú chó nhỏ và một chú mèo nhỏ, chó ba tuổi, mèo hai tuổi, chúng rất xinh. Chó nhỏ thích chơi, mèo nhỏ thích nghỉ ngơi trên ghế."]
];
const L3=[
["大家好！我叫白家月，我是法国人，今年二十一岁。我在学校学习中文，我的老师是王老师，她是北京人，也是我的朋友。我有一个哥哥，他在法国工作，我非常想他。","Dàjiā hǎo! Wǒ jiào Bái Jiāyuè, wǒ shì Fǎguó rén, jīnnián èrshíyī suì. Wǒ zài xuéxiào xuéxí Zhōngwén, wǒ de lǎoshī shì Wáng lǎoshī, tā shì Běijīng rén, yě shì wǒ de péngyou. Wǒ yǒu yí gè gēge, tā zài Fǎguó gōngzuò, wǒ fēicháng xiǎng tā.","Chào mọi người! Tôi tên Bạch Gia Nguyệt, là người Pháp, năm nay 21 tuổi. Tôi học tiếng Trung ở trường, cô giáo của tôi là cô Vương, cô là người Bắc Kinh, cũng là bạn của tôi. Tôi có một người anh trai, anh ấy làm việc ở Pháp, tôi rất nhớ anh ấy."],
["我爸爸是医生，在医院工作。他早上七点上班，晚上七点半下班，病人太多了，他没有时间吃午饭。今天是星期天，他不上班，在家休息，我和妈妈给他做了饺子。","Wǒ bàba shì yīshēng, zài yīyuàn gōngzuò. Tā zǎoshang qī diǎn shàngbān, wǎnshang qī diǎn bàn xiàbān, bìngrén tài duō le, tā méiyǒu shíjiān chī wǔfàn. Jīntiān shì xīngqītiān, tā bú shàngbān, zài jiā xiūxi, wǒ hé māma gěi tā zuò le jiǎozi.","Bố tôi là bác sĩ, làm việc ở bệnh viện. Ông 7 giờ sáng đi làm, 7 rưỡi tối tan ca, bệnh nhân quá đông nên ông không có thời gian ăn trưa. Hôm nay là chủ nhật, ông không đi làm, ở nhà nghỉ ngơi, tôi và mẹ làm há cảo cho ông."],
["喂，你好！现在你在哪儿？我在学校前边，你呢？我在家，我想去超市买东西，你想去吗？好的，我们下午两点在超市见吧！好的，再见！","Wèi, nǐ hǎo! Xiànzài nǐ zài nǎr? Wǒ zài xuéxiào qiánbian, nǐ ne? Wǒ zài jiā, wǒ xiǎng qù chāoshì mǎi dōngxi, nǐ xiǎng qù ma? Hǎo de, wǒmen xiàwǔ liǎng diǎn zài chāoshì jiàn ba! Hǎo de, zàijiàn!","Alo, xin chào! Bây giờ bạn đang ở đâu? Mình ở phía trước trường, còn bạn? Mình ở nhà, mình muốn đi siêu thị mua đồ, bạn có muốn đi không? Được, chúng ta gặp nhau ở siêu thị lúc 2 giờ chiều nhé! Được, tạm biệt!"],
["明天是星期一，上午八点我有中文课，十点十分下课。下午我在书店读书，晚上六点半在家吃晚饭，晚饭后我和朋友看电视。","Míngtiān shì xīngqīyī, shàngwǔ bā diǎn wǒ yǒu Zhōngwén kè, shí diǎn shí fēn xiàkè. Xiàwǔ wǒ zài shūdiàn dúshū, wǎnshang liù diǎn bàn zài jiā chī wǎnfàn, wǎnfàn hòu wǒ hé péngyou kàn diànshì.","Ngày mai là thứ hai, 8 giờ sáng tôi có tiết tiếng Trung, 10 giờ 10 phút tan học. Buổi chiều tôi đọc sách ở tiệm sách, 6 rưỡi tối ăn tối ở nhà, sau bữa tối tôi cùng bạn xem tivi."],
["我和朋友坐出租车去西安饭店吃晚饭。那边的包子和米饭非常好吃，菜也很多。朋友说：“这个饭店真漂亮！”我说：“你想吃什么？”他说：“我想吃饺子和包子，你呢？”","Wǒ hé péngyou zuò chūzūchē qù Xī'ān Fàndiàn chī wǎnfàn. Nàbiān de bāozi hé mǐfàn fēicháng hǎochī, cài yě hěn duō. Péngyou shuō: “Zhège fàndiàn zhēn piàoliang!” Wǒ shuō: “Nǐ xiǎng chī shénme?” Tā shuō: “Wǒ xiǎng chī jiǎozi hé bāozi, nǐ ne?”","Tôi và bạn đi taxi đến nhà hàng Tây An ăn tối. Bánh bao và cơm ở đó ngon vô cùng, món ăn cũng rất nhiều. Bạn nói: “Nhà hàng này đẹp thật!” Tôi hỏi: “Bạn muốn ăn gì?” Bạn đáp: “Mình muốn ăn há cảo và bánh bao, còn bạn?”"],
["刘明和王一雪有两个孩子。女儿叫刘小雪，今年十二岁，是学生，她喜欢读书，也喜欢唱歌。儿子叫刘小明，今年五岁，他喜欢玩，也喜欢看电视。刘明是医生，王一雪的工作也很忙。","Liú Míng hé Wáng Yīxuě yǒu liǎng gè háizi. Nǚ'ér jiào Liú Xiǎoxuě, jīnnián shí'èr suì, shì xuésheng, tā xǐhuan dúshū, yě xǐhuan chàng gē. Érzi jiào Liú Xiǎomíng, jīnnián wǔ suì, tā xǐhuan wán, yě xǐhuan kàn diànshì. Liú Míng shì yīshēng, Wáng Yīxuě de gōngzuò yě hěn máng.","Lưu Minh và Vương Nhất Tuyết có hai đứa con. Con gái tên Lưu Tiểu Tuyết, năm nay 12 tuổi, là học sinh, em thích đọc sách, cũng thích hát. Con trai tên Lưu Tiểu Minh, năm nay 5 tuổi, bé thích chơi, cũng thích xem tivi. Lưu Minh là bác sĩ, công việc của Vương Nhất Tuyết cũng rất bận."]

["因为今天是星期天，所以我不上班。我想先在家做饭，然后和朋友一起去电影院看电影，但是我的朋友下午要上课，所以我们晚上七点见。","Yīnwèi jīntiān shì xīngqītiān, suǒyǐ wǒ bú shàngbān. Wǒ xiǎng xiān zài jiā zuò fàn, ránhòu hé péngyou yìqǐ qù diànyǐngyuàn kàn diànyǐng, dànshì wǒ de péngyou xiàwǔ yào shàngkè, suǒyǐ wǒmen wǎnshang qī diǎn jiàn.","Vì hôm nay là chủ nhật nên tôi không đi làm. Tôi muốn nấu cơm ở nhà trước, sau đó cùng bạn đi rạp xem phim, nhưng buổi chiều bạn tôi phải đi học, nên chúng tôi hẹn gặp lúc 7 giờ tối."],
["我爸爸和妈妈都在医院工作，他们都是医生。爸爸最近很忙，已经三天没有回家了，但是他说他很喜欢这个工作，因为病人们也很喜欢他。","Wǒ bàba hé māma dōu zài yīyuàn gōngzuò, tāmen dōu shì yīshēng. Bàba zuìjìn hěn máng, yǐjīng sān tiān méiyǒu huí jiā le, dànshì tā shuō tā hěn xǐhuan zhège gōngzuò, yīnwèi bìngrénmen yě hěn xǐhuan tā.","Bố và mẹ tôi đều làm việc ở bệnh viện, họ đều là bác sĩ. Dạo này bố rất bận, đã ba ngày không về nhà, nhưng ông nói ông rất thích công việc này, vì các bệnh nhân cũng rất quý ông."],
["“你为什么没去超市？”“因为朋友给我打电话，他说明天想来我家吃饭，所以我今天在家做饺子，没有时间去。”","“Nǐ wèishénme méi qù chāoshì?” “Yīnwèi péngyou gěi wǒ dǎ diànhuà, tā shuō míngtiān xiǎng lái wǒ jiā chī fàn, suǒyǐ wǒ jīntiān zài jiā zuò jiǎozi, méiyǒu shíjiān qù.”","“Tại sao bạn không đi siêu thị?” “Vì bạn tôi gọi điện, nói ngày mai muốn đến nhà tôi ăn cơm, nên hôm nay tôi ở nhà làm há cảo, không có thời gian đi.”"],
["现在是晚上六点半，我已经下班了。我先坐出租车去超市买一些东西，然后回家做晚饭。我女朋友喜欢吃面条儿，可是我不太会做，所以今天我想做米饭和一些菜。","Xiànzài shì wǎnshang liù diǎn bàn, wǒ yǐjīng xiàbān le. Wǒ xiān zuò chūzūchē qù chāoshì mǎi yīxiē dōngxi, ránhòu huí jiā zuò wǎnfàn. Wǒ nǚ péngyou xǐhuan chī miàntiáo, kěshì wǒ bú tài huì zuò, suǒyǐ jīntiān wǒ xiǎng zuò mǐfàn hé yīxiē cài.","Bây giờ là 6 rưỡi tối, tôi đã tan ca rồi. Tôi đi taxi đến siêu thị mua một ít đồ trước, sau đó về nhà nấu cơm tối. Bạn gái tôi thích ăn mì, nhưng tôi không giỏi làm lắm, nên hôm nay tôi muốn làm cơm và vài món nữa."],
["我的学校很大，学校前边有一家书店和一个电影院，外边还有一个很漂亮的公园。每个星期六，我和朋友都先去书店读书，然后去公园玩，我们都觉得这样很好。","Wǒ de xuéxiào hěn dà, xuéxiào qiánbian yǒu yì jiā shūdiàn hé yí gè diànyǐngyuàn, wàibian hái yǒu yí gè hěn piàoliang de gōngyuán. Měi gè xīngqīliù, wǒ hé péngyou dōu xiān qù shūdiàn dúshū, ránhòu qù gōngyuán wán, wǒmen dōu juéde zhèyàng hěn hǎo.","Trường của tôi rất lớn, phía trước trường có một tiệm sách và một rạp chiếu phim, bên ngoài còn có một công viên rất đẹp. Mỗi thứ bảy, tôi và bạn đều đi tiệm sách đọc sách trước, sau đó đến công viên chơi, chúng tôi đều thấy như vậy rất tốt."],
["王老师说：“同学们，现在上课。今天我们学习第九课，请打开书。先请你们读一遍，然后我再说一遍。如果你们不知道这个是什么意思，请问我。”学生们说：“好的，谢谢老师！”","Wáng lǎoshī shuō: “Tóngxuémen, xiànzài shàngkè. Jīntiān wǒmen xuéxí dì jiǔ kè, qǐng dǎkāi shū. Xiān qǐng nǐmen dú yí biàn, ránhòu wǒ zài shuō yí biàn. Rúguǒ nǐmen bù zhīdào zhège shì shénme yìsi, qǐng wèn wǒ.” Xuéshengmen shuō: “Hǎo de, xièxie lǎoshī!”","Cô Vương nói: “Các bạn học, bây giờ vào học. Hôm nay chúng ta học bài 9, xin mở sách ra. Trước tiên mời các bạn đọc một lần, sau đó cô sẽ nói lại một lần. Nếu các bạn không biết cái này có nghĩa là gì, hãy hỏi cô.” Các học sinh nói: “Vâng ạ, cảm ơn cô!”"]

["我的闹钟是红色的，桌子上有一台蓝色的笔记本电脑，椅子上有一本书。","Wǒ de nàozhōng shì hóngsè de, zhuōzi shàng yǒu yì tái lánsè de bǐjìběn diànnǎo, yǐzi shàng yǒu yì běn shū.","Đồng hồ báo thức của tôi màu đỏ, trên bàn có một chiếc máy tính xách tay màu xanh dương, trên ghế có một cuốn sách."]);

["我哥哥在医院工作，他有一台黑色的笔记本电脑，一个银色的智能手机，还有一块蓝色的智能手表，他的工作很忙，他很喜欢这些新东西。","Wǒ gēge zài yīyuàn gōngzuò, tā yǒu yì tái hēisè de bǐjìběn diànnǎo, yí gè yínsè de zhìnéng shǒujī, hái yǒu yí kuài lánsè de zhìnéng shǒubiǎo, tā de gōngzuò hěn máng, tā hěn xǐhuan zhèxiē xīn dōngxi.","Anh trai tôi làm việc ở bệnh viện, anh ấy có một chiếc máy tính xách tay màu đen, một chiếc điện thoại thông minh màu bạc, còn có một chiếc đồng hồ thông minh màu xanh dương, công việc của anh rất bận, anh rất thích những món đồ mới này."],
["我女朋友喜欢粉色，她有一个粉色的手机，一个粉色的智能手环，还有一台白色的平板电脑，她下班后喜欢在家用平板电脑看电影。","Wǒ nǚ péngyou xǐhuan fěnsè, tā yǒu yí gè fěnsè de shǒujī, yí gè fěnsè de zhìnéng shǒuhuán, hái yǒu yì tái báisè de píngbǎn diànnǎo, tā xiàbān hòu xǐhuan zài jiā yòng píngbǎn diànnǎo kàn diànyǐng.","Bạn gái tôi thích màu hồng, cô ấy có một chiếc điện thoại màu hồng, một chiếc vòng đeo tay thông minh màu hồng, còn có một chiếc máy tính bảng màu trắng, sau khi tan ca cô thích ở nhà dùng máy tính bảng xem phim."]);

["我和妈妈去商店买东西。我想买一块手表，妈妈想买一个闹钟。商店里有黑色的、白色的、红色的手表。我喜欢那块黑色的智能手表，妈妈喜欢那个蓝色的闹钟。我们买了东西，下午坐出租车回家。","Wǒ hé māma qù shāngdiàn mǎi dōngxi. Wǒ xiǎng mǎi yí kuài shǒubiǎo, māma xiǎng mǎi yí gè nàozhōng. Shāngdiàn lǐ yǒu hēisè de, báisè de, hóngsè de shǒubiǎo. Wǒ xǐhuan nà kuài hēisè de zhìnéng shǒubiǎo, māma xǐhuan nàge lánsè de nàozhōng. Wǒmen mǎi le dōngxi, xiàwǔ zuò chūzūchē huí jiā.","Tôi và mẹ đi cửa hàng mua đồ. Tôi muốn mua một chiếc đồng hồ đeo tay, mẹ muốn mua một chiếc đồng hồ báo thức. Trong cửa hàng có đồng hồ màu đen, màu trắng, màu đỏ. Tôi thích chiếc đồng hồ thông minh màu đen kia, mẹ thích chiếc đồng hồ báo thức màu xanh dương đó. Chúng tôi mua đồ xong, buổi chiều đi taxi về nhà."],
["“李文，你的新平板电脑真漂亮！是什么颜色的？”“谢谢，是蓝色的。我的笔记本电脑是灰色的，我的手机也是蓝色的，我很喜欢蓝色。”“你的手表呢？”“我的手表是黑色的，不是蓝色的。”","“Lǐ Wén, nǐ de xīn píngbǎn diànnǎo zhēn piàoliang! Shì shénme yánsè de?” “Xièxie, shì lánsè de. Wǒ de bǐjìběn diànnǎo shì huīsè de, wǒ de shǒujī yě shì lánsè de, wǒ hěn xǐhuan lánsè.” “Nǐ de shǒubiǎo ne?” “Wǒ de shǒubiǎo shì hēisè de, bú shì lánsè de.”","“Lý Văn, máy tính bảng mới của bạn đẹp thật! Nó màu gì vậy?” “Cảm ơn, nó màu xanh dương. Máy tính xách tay của mình màu xám, điện thoại của mình cũng màu xanh dương, mình rất thích màu xanh dương.” “Còn đồng hồ của bạn?” “Đồng hồ của mình màu đen, không phải màu xanh dương.”"]);

["我先在超市买了一些菜，然后去商店看了智能手环。白色的、黄色的、绿色的都很漂亮，但是我女朋友喜欢粉色的，所以我没有买。我想明天和她一起再去一次。","Wǒ xiān zài chāoshì mǎi le yīxiē cài, ránhòu qù shāngdiàn kàn le zhìnéng shǒuhuán. Báisè de, huángsè de, lǜsè de dōu hěn piàoliang, dànshì wǒ nǚ péngyou xǐhuan fěnsè de, suǒyǐ wǒ méiyǒu mǎi. Wǒ xiǎng míngtiān hé tā yìqǐ zài qù yí cì.","Tôi mua một ít rau ở siêu thị trước, sau đó đến cửa hàng xem vòng đeo tay thông minh. Loại màu trắng, màu vàng, màu xanh lá đều rất đẹp, nhưng bạn gái tôi thích màu hồng, nên tôi không mua. Tôi muốn ngày mai cùng cô ấy đi lại một lần nữa."]);

["你喜欢什么颜色？我喜欢蓝色，我的妹妹喜欢粉色，我的哥哥喜欢黑色。","Nǐ xǐhuan shénme yánsè? Wǒ xǐhuan lánsè, wǒ de mèimei xǐhuan fěnsè, wǒ de gēge xǐhuan hēisè.","Bạn thích màu gì? Tôi thích màu xanh dương, em gái tôi thích màu hồng, anh trai tôi thích màu đen."],
["我的小猫是白色的，小狗是黄色的，它们在黑色的椅子下玩。","Wǒ de xiǎomāo shì báisè de, xiǎo gǒu shì huángsè de, tāmen zài hēisè de yǐzi xià wán.","Mèo nhỏ của tôi màu trắng, chó nhỏ màu vàng, chúng chơi dưới chiếc ghế màu đen."],
["医生的桌子是白色的，椅子是绿色的，桌子上有一个黄色的电话。","Yīshēng de zhuōzi shì báisè de, yǐzi shì lǜsè de, zhuōzi shàng yǒu yí gè huángsè de diànhuà.","Bàn của bác sĩ màu trắng, ghế màu xanh lá, trên bàn có một chiếc điện thoại màu vàng."]);
L2.push(
["我很喜欢绿色，我的房间里有很多绿色的东西：桌子是绿色的，椅子是绿色的，书也是绿色的，妈妈说我的房间太绿了。","Wǒ hěn xǐhuan lǜsè, wǒ de fángjiān lǐ yǒu hěn duō lǜsè de dōngxi: zhuōzi shì lǜsè de, yǐzi shì lǜsè de, shū yě shì lǜsè de, māma shuō wǒ de fángjiān tài lǜ le.","Tôi rất thích màu xanh lá, trong phòng tôi có rất nhiều đồ màu xanh lá: bàn màu xanh lá, ghế màu xanh lá, sách cũng màu xanh lá, mẹ nói phòng của tôi xanh quá rồi."],
["我的朋友有两个手机，一个是黑色的，一个是红色的。黑色的手机他用来工作，红色的手机他用来给家人打电话。","Wǒ de péngyou yǒu liǎng gè shǒujī, yí gè shì hēisè de, yí gè shì hóngsè de. Hēisè de shǒujī tā yòng lái gōngzuò, hóngsè de shǒujī tā yòng lái gěi jiārén dǎ diànhuà.","Bạn tôi có hai chiếc điện thoại, một chiếc màu đen, một chiếc màu đỏ. Chiếc màu đen anh ấy dùng để làm việc, chiếc màu đỏ anh ấy dùng để gọi điện cho người nhà."],
["书店里的桌子是白色的，椅子是灰色的，书店里有很多蓝色的书，还有一只黄色的小猫在椅子上休息。","Shūdiàn lǐ de zhuōzi shì báisè de, yǐzi shì huīsè de, shūdiàn lǐ yǒu hěn duō lánsè de shū, hái yǒu yì zhī huángsè de xiǎomāo zài yǐzi shàng xiūxi.","Bàn trong tiệm sách màu trắng, ghế màu xám, trong tiệm có rất nhiều cuốn sách màu xanh dương, còn có một chú mèo nhỏ màu vàng đang nghỉ ngơi trên ghế."]);
L3.push(
["“你好，请问你想买什么？”“我想买一个手机，有红色的吗？”“对不起，没有红色的，有黑色的、白色的和蓝色的。”“蓝色的很好看，我喜欢蓝色。我要这个蓝色的。”“好的，谢谢您！”","“Nǐ hǎo, qǐngwèn nǐ xiǎng mǎi shénme?” “Wǒ xiǎng mǎi yí gè shǒujī, yǒu hóngsè de ma?” “Duìbuqǐ, méiyǒu hóngsè de, yǒu hēisè de, báisè de hé lánsè de.” “Lánsè de hěn hǎokàn, wǒ xǐhuan lánsè. Wǒ yào zhège lánsè de.” “Hǎo de, xièxie nín!”","“Xin chào, xin hỏi bạn muốn mua gì ạ?” “Tôi muốn mua một chiếc điện thoại, có màu đỏ không?” “Xin lỗi, không có màu đỏ, có màu đen, màu trắng và màu xanh dương.” “Màu xanh dương rất đẹp, tôi thích màu xanh dương. Tôi lấy chiếc màu xanh dương này.” “Vâng, cảm ơn bạn!”"],
["我家有五口人，爸爸喜欢黑色，妈妈喜欢红色，哥哥喜欢蓝色，妹妹喜欢粉色，我喜欢绿色。我们的手机也是这些颜色：爸爸的是黑色的，妈妈的是红色的，哥哥的是蓝色的，妹妹的是粉色的，我的是绿色的。","Wǒ jiā yǒu wǔ kǒu rén, bàba xǐhuan hēisè, māma xǐhuan hóngsè, gēge xǐhuan lánsè, mèimei xǐhuan fěnsè, wǒ xǐhuan lǜsè. Wǒmen de shǒujī yě shì zhèxiē yánsè: bàba de shì hēisè de, māma de shì hóngsè de, gēge de shì lánsè de, mèimei de shì fěnsè de, wǒ de shì lǜsè de.","Nhà tôi có 5 người, bố thích màu đen, mẹ thích màu đỏ, anh trai thích màu xanh dương, em gái thích màu hồng, tôi thích màu xanh lá. Điện thoại của chúng tôi cũng là những màu này: của bố màu đen, của mẹ màu đỏ, của anh màu xanh dương, của em gái màu hồng, của tôi màu xanh lá."]);
L4.push(
["我的朋友想买一块新手表，他先去商店看了黑色的、银色的和金色的，然后给我打电话，问我喜欢哪一块。我觉得银色的很好看，但是金色的那块太大了，黑色的也很好看，所以我说都可以。","Wǒ de péngyou xiǎng mǎi yí kuài xīn shǒubiǎo, tā xiān qù shāngdiàn kàn le hēisè de, yínsè de hé jīnsè de, ránhòu gěi wǒ dǎ diànhuà, wèn wǒ xǐhuan nǎ yí kuài. Wǒ juéde yínsè de hěn hǎokàn, dànshì jīnsè de nà kuài tài dà le, hēisè de yě hěn hǎokàn, suǒyǐ wǒ shuō dōu kěyǐ.","Bạn tôi muốn mua một chiếc đồng hồ đeo tay mới, anh ấy đến cửa hàng xem loại màu đen, màu bạc và màu vàng kim trước, sau đó gọi điện hỏi tôi thích chiếc nào. Tôi thấy màu bạc rất đẹp, nhưng chiếc màu vàng kim quá to, màu đen cũng rất đẹp, nên tôi nói chiếc nào cũng được."],
["今天是星期天，我和女儿去公园玩。公园里有红色的、黄色的、粉色的花，非常漂亮。我女儿说她最喜欢粉色的，但是我觉得白色的也很好看。我们坐在绿色的椅子上休息，然后一起回家做晚饭。","Jīntiān shì xīngqītiān, wǒ hé nǚ'ér qù gōngyuán wán. Gōngyuán lǐ yǒu hóngsè de, huángsè de, fěnsè de huā, fēicháng piàoliang. Wǒ nǚ'ér shuō tā zuì xǐhuan fěnsè de, dànshì wǒ juéde báisè de yě hěn hǎokàn. Wǒmen zuò zài lǜsè de yǐzi shàng xiūxi, ránhòu yìqǐ huí jiā zuò wǎnfàn.","Hôm nay là chủ nhật, tôi và con gái đi công viên chơi. Trong công viên có hoa màu đỏ, màu vàng, màu hồng, đẹp vô cùng. Con gái tôi nói em thích nhất màu hồng, nhưng tôi thấy màu trắng cũng rất đẹp. Chúng tôi ngồi nghỉ trên chiếc ghế màu xanh lá, sau đó cùng về nhà nấu cơm tối."]);
L1.push(
["这个红色的手机是我的，那个蓝色的手机是我妹妹的。","Zhège hóngsè de shǒujī shì wǒ de, nàge lánsè de shǒujī shì wǒ mèimei de.","Chiếc điện thoại màu đỏ này là của tôi, chiếc màu xanh dương kia là của em gái tôi."],
["你的手表是什么颜色的？是银色的吗？不是，是金色的。","Nǐ de shǒubiǎo shì shénme yánsè de? Shì yínsè de ma? Bú shì, shì jīnsè de.","Đồng hồ của bạn màu gì? Màu bạc phải không? Không phải, màu vàng kim."],
["我今天想吃绿色的菜和白色的米饭，也想吃一些黄色的面条儿。","Wǒ jīntiān xiǎng chī lǜsè de cài hé báisè de mǐfàn, yě xiǎng chī yīxiē huángsè de miàntiáo.","Hôm nay tôi muốn ăn rau xanh và cơm trắng, cũng muốn ăn một ít mì vàng."]);
L2.push(
["商店里有红色的、白色的、绿色的闹钟，我想给我的女儿买一个粉色的，可是商店里没有粉色的。","Shāngdiàn lǐ yǒu hóngsè de, báisè de, lǜsè de nàozhōng, wǒ xiǎng gěi wǒ nǚ'ér mǎi yí gè fěnsè de, kěshì shāngdiàn lǐ méiyǒu fěnsè de.","Trong cửa hàng có đồng hồ báo thức màu đỏ, trắng, xanh lá, tôi muốn mua cho con gái một chiếc màu hồng nhưng cửa hàng không có màu hồng."],
["我看见一只黑色的小猫在白色的桌子上玩，它的眼睛是绿色的，真漂亮！","Wǒ kànjiàn yì zhī hēisè de xiǎomāo zài báisè de zhuōzi shàng wán, tā de yǎnjing shì lǜsè de, zhēn piàoliang!","Tôi nhìn thấy một chú mèo nhỏ màu đen chơi trên chiếc bàn màu trắng, mắt nó màu xanh lá, đẹp thật!"],
["学校前边的电影院很大，电影院里的椅子是红色的，很多人喜欢在那边看电影。","Xuéxiào qiánbian de diànyǐngyuàn hěn dà, diànyǐngyuàn lǐ de yǐzi shì hóngsè de, hěn duō rén xǐhuan zài nàbiān kàn diànyǐng.","Rạp chiếu phim phía trước trường rất lớn, ghế trong rạp màu đỏ, có rất nhiều người thích xem phim ở đó."]);
L3.push(
["王老师问：“同学们，你们喜欢什么颜色？”李文说：“我喜欢蓝色。”白家月说：“我喜欢粉色，我的手机、手表和闹钟都是粉色的。”陈天中说：“我喜欢黑色，黑色很好看。”王老师说：“谢谢大家，你们喜欢的颜色都很漂亮。”","Wáng lǎoshī wèn: “Tóngxuémen, nǐmen xǐhuan shénme yánsè?” Lǐ Wén shuō: “Wǒ xǐhuan lánsè.” Bái Jiāyuè shuō: “Wǒ xǐhuan fěnsè, wǒ de shǒujī, shǒubiǎo hé nàozhōng dōu shì fěnsè de.” Chén Tiānzhōng shuō: “Wǒ xǐhuan hēisè, hēisè hěn hǎokàn.” Wáng lǎoshī shuō: “Xièxie dàjiā, nǐmen xǐhuan de yánsè dōu hěn piàoliang.”","Cô Vương hỏi: “Các bạn học, các bạn thích màu gì?” Lý Văn nói: “Em thích màu xanh dương.” Bạch Gia Nguyệt nói: “Em thích màu hồng, điện thoại, đồng hồ đeo tay và đồng hồ báo thức của em đều màu hồng.” Trần Thiên Trung nói: “Em thích màu đen, màu đen rất đẹp.” Cô Vương nói: “Cảm ơn mọi người, những màu các em thích đều rất đẹp.”"],
["我的新家有三个房间。我的房间是蓝色的，妹妹的房间是粉色的，爸爸和妈妈的房间是白色的。房间里的桌子和椅子也是这些颜色，我们都很喜欢我们的新家。","Wǒ de xīn jiā yǒu sān gè fángjiān. Wǒ de fángjiān shì lánsè de, mèimei de fángjiān shì fěnsè de, bàba hé māma de fángjiān shì báisè de. Fángjiān lǐ de zhuōzi hé yǐzi yě shì zhèxiē yánsè, wǒmen dōu hěn xǐhuan wǒmen de xīn jiā.","Nhà mới của tôi có ba phòng. Phòng của tôi màu xanh dương, phòng của em gái màu hồng, phòng của bố mẹ màu trắng. Bàn và ghế trong phòng cũng là những màu này, chúng tôi đều rất thích ngôi nhà mới."]);
L4.push(
["明天是我妹妹的生日，我想给她买一块手表。她喜欢粉色，可是商店里的粉色手表太小了，所以我先去看了白色的，然后给妈妈打电话，问她这个颜色好不好。","Míngtiān shì wǒ mèimei de shēngrì, wǒ xiǎng gěi tā mǎi yí kuài shǒubiǎo. Tā xǐhuan fěnsè, kěshì shāngdiàn lǐ de fěnsè shǒubiǎo tài xiǎo le, suǒyǐ wǒ xiān qù kàn le báisè de, ránhòu gěi māma dǎ diànhuà, wèn tā zhège yánsè hǎo bù hǎo.","Ngày mai là sinh nhật em gái tôi, tôi muốn mua cho em một chiếc đồng hồ đeo tay. Em thích màu hồng, nhưng đồng hồ màu hồng trong cửa hàng quá nhỏ, nên tôi xem loại màu trắng trước, sau đó gọi điện hỏi mẹ màu này có đẹp không."],
["我在学校前边等朋友，一边看手机，一边看前边的出租车。有红色的，有黄色的，也有绿色的，可是没有白色的。我朋友坐的出租车是黄色的，他说他已经到学校了。","Wǒ zài xuéxiào qiánbian děng péngyou, yìbiān kàn shǒujī, yìbiān kàn qiánbian de chūzūchē. Yǒu hóngsè de, yǒu huángsè de, yě yǒu lǜsè de, kěshì méiyǒu báisè de. Wǒ péngyou zuò de chūzūchē shì huángsè de, tā shuō tā yǐjīng dào xuéxiào le.","Tôi đứng đợi bạn ở phía trước trường, vừa xem điện thoại vừa nhìn những chiếc taxi phía trước. Có chiếc màu đỏ, có chiếc màu vàng, cũng có chiếc màu xanh lá, nhưng không có chiếc màu trắng. Chiếc taxi bạn tôi ngồi màu vàng, anh ấy nói anh ấy đã đến trường rồi."]);
L1.push(
["对不起，我没看见你。没事！你好，我叫李文，你呢？","Duìbuqǐ, wǒ méi kànjiàn nǐ. Méishì! Nǐ hǎo, wǒ jiào Lǐ Wén, nǐ ne?","Xin lỗi, mình không thấy bạn. Không sao! Chào bạn, mình tên là Lý Văn, còn bạn?"],
["你家有几口人？我家有四口人：爸爸、妈妈、哥哥和我。","Nǐ jiā yǒu jǐ kǒu rén? Wǒ jiā yǒu sì kǒu rén: bàba, māma, gēge hé wǒ.","Nhà bạn có mấy người? Nhà tôi có 4 người: bố, mẹ, anh trai và tôi."],
["星期日你有事吗？没事，我在家休息。那我们去电影院看电影吧！","Xīngqīrì nǐ yǒu shì ma? Méishì, wǒ zài jiā xiūxi. Nà wǒmen qù diànyǐngyuàn kàn diànyǐng ba!","Chủ nhật bạn có việc không? Không có gì, mình ở nhà nghỉ ngơi. Vậy chúng ta đi rạp xem phim nhé!"]);
L2.push(
["胡医生是我爸爸的朋友，他在医院工作，他家有五口人，他有一个儿子和两个女儿，儿子今年十岁，女儿们一个八岁，一个五岁。","Hú yīshēng shì wǒ bàba de péngyou, tā zài yīyuàn gōngzuò, tā jiā yǒu wǔ kǒu rén, tā yǒu yí gè érzi hé liǎng gè nǚ'ér, érzi jīnnián shí suì, nǚ'érmen yí gè bā suì, yí gè wǔ suì.","Bác sĩ Hồ là bạn của bố tôi, ông làm việc ở bệnh viện, nhà ông có 5 người, ông có một con trai và hai con gái, con trai năm nay 10 tuổi, hai con gái một đứa 8 tuổi, một đứa 5 tuổi."],
["星期日我有事，上午十点我在学校，下午两点半去医院看爸爸，晚上六点回家吃晚饭。","Xīngqīrì wǒ yǒu shì, shàngwǔ shí diǎn wǒ zài xuéxiào, xiàwǔ liǎng diǎn bàn qù yīyuàn kàn bàba, wǎnshang liù diǎn huí jiā chī wǎnfàn.","Chủ nhật tôi có việc, 10 giờ sáng tôi ở trường, 2 rưỡi chiều đến bệnh viện thăm bố, 6 giờ tối về nhà ăn tối."],
["你现在有事吗？没事，我在家看电视。那你来我家吧，我想做饺子，你喜欢吃吗？","Nǐ xiànzài yǒu shì ma? Méishì, wǒ zài jiā kàn diànshì. Nà nǐ lái wǒ jiā ba, wǒ xiǎng zuò jiǎozi, nǐ xǐhuan chī ma?","Bây giờ bạn có việc không? Không có gì, mình ở nhà xem tivi. Vậy bạn đến nhà mình nhé, mình muốn làm há cảo, bạn có thích ăn không?"]);
L3.push(
["现在几点？现在是下午四点十五分。你几点下班？我六点半下班。我们几点在哪儿见？六点四十在学校前边见吧！","Xiànzài jǐ diǎn? Xiànzài shì xiàwǔ sì diǎn shíwǔ fēn. Nǐ jǐ diǎn xiàbān? Wǒ liù diǎn bàn xiàbān. Wǒmen jǐ diǎn zài nǎr jiàn? Liù diǎn sìshí zài xuéxiào qiánbian jiàn ba!","Bây giờ là mấy giờ? Bây giờ là 4 giờ 15 chiều. Bạn mấy giờ tan ca? Tôi 6 rưỡi tan ca. Chúng ta mấy giờ gặp nhau ở đâu? 6 giờ 40 gặp nhau ở phía trước trường nhé!"],
["今天是十月十八号，星期日。明天是十月十九号，星期一。我星期一和星期三上午有中文课，星期二和星期四在医院工作，星期五休息，星期六和朋友去公园玩。","Jīntiān shì shí yuè shíbā hào, Xīngqīrì. Míngtiān shì shí yuè shíjiǔ hào, Xīngqīyī. Wǒ Xīngqīyī hé Xīngqīsān shàngwǔ yǒu Zhōngwén kè, Xīngqī'èr hé Xīngqīsì zài yīyuàn gōngzuò, Xīngqīwǔ xiūxi, Xīngqīliù hé péngyou qù gōngyuán wán.","Hôm nay là ngày 18 tháng 10, chủ nhật. Ngày mai là ngày 19 tháng 10, thứ hai. Thứ hai và thứ tư buổi sáng tôi có tiết tiếng Trung, thứ ba và thứ năm tôi làm việc ở bệnh viện, thứ sáu nghỉ ngơi, thứ bảy cùng bạn đi công viên chơi."],

["王一雪问售货员：“请问，有杯子吗？”售货员说：“有，杯子在这边。”王一雪问：“多少钱一个？”售货员说：“这些五块钱一个，那些十块钱一个。”王一雪说：“我买这个吧。”","Wáng Yīxuě wèn shòuhuòyuán: “Qǐngwèn, yǒu bēizi ma?” Shòuhuòyuán shuō: “Yǒu, bēizi zài zhèbiān.” Wáng Yīxuě wèn: “Duōshǎo qián yí gè?” Shòuhuòyuán shuō: “Zhèxiē wǔ kuài qián yí gè, nàxiē shí kuài qián yí gè.” Wáng Yīxuě shuō: “Wǒ mǎi zhège ba.”","Vương Nhất Tuyết hỏi nhân viên bán hàng: “Xin hỏi, có cốc không?” Nhân viên nói: “Có, cốc ở bên này.” Vương Nhất Tuyết hỏi: “Bao nhiêu tiền một cái?” Nhân viên nói: “Những cái này 5 đồng một cái, những cái kia 10 đồng một cái.” Vương Nhất Tuyết nói: “Tôi mua cái này nhé.”"],

["王一雪对刘明说：“这个商店衣服真多，这件一百元，怎么样？”刘明说：“好看，也不贵。”王一雪说：“小雪能穿，买一件吧。”","Wáng Yīxuě duì Liú Míng shuō: “Zhège shāngdiàn yīfu zhēn duō, zhè jiàn yì bǎi yuán, zěnmeyàng?” Liú Míng shuō: “Hǎokàn, yě bú guì.” Wáng Yīxuě shuō: “Xiǎoxuě néng chuān, mǎi yí jiàn ba.”","Vương Nhất Tuyết nói với Lưu Minh: “Cửa hàng này quần áo nhiều thật, cái này 100 tệ, thế nào?” Lưu Minh nói: “Đẹp, cũng không đắt.” Vương Nhất Tuyết nói: “Tiểu Tuyết mặc được, mua một cái đi.”"],
["刘明问：“小明能穿吗？”王一雪说：“不能，这些是女孩子的衣服，男孩子的衣服在那儿。”刘明说：“好的。”","Liú Míng wèn: “Xiǎomíng néng chuān ma?” Wáng Yīxuě shuō: “Bù néng, zhèxiē shì nǚháizi de yīfu, nánháizi de yīfu zài nàr.” Liú Míng shuō: “Hǎo de.”","Lưu Minh hỏi: “Tiểu Minh mặc được không?” Vương Nhất Tuyết nói: “Không được, những cái này là quần áo con gái, quần áo con trai ở đằng kia.” Lưu Minh nói: “Được.”"],
["在中国，钱有“元”“角”“分”，平常我们说“块”“毛”“分”。三块五就是三元五角，十块钱就是十元。","Zài Zhōngguó, qián yǒu “yuán” “jiǎo” “fēn”, píngcháng wǒmen shuō “kuài” “máo” “fēn”. Sān kuài wǔ jiùshì sān yuán wǔ jiǎo, shí kuài qián jiùshì shí yuán.","Ở Trung Quốc, tiền có “nguyên (元)”, “giác (角)”, “phân (分)”, bình thường chúng ta nói “khối (块)”, “mao (毛)”, “phân (分)”. 3 đồng rưỡi tức là 3 nguyên 5 giác, 10 đồng tức là 10 nguyên."],
["在中国，一斤是五百克，半斤是二百五十克，两斤就是一公斤。我想买两斤苹果，三块五一斤，一共七块钱。","Zài Zhōngguó, yì jīn shì wǔbǎi kè, bàn jīn shì èrbǎi wǔshí kè, liǎng jīn jiùshì yì gōngjīn. Wǒ xiǎng mǎi liǎng jīn píngguǒ, sān kuài wǔ yì jīn, yígòng qī kuài qián.","Ở Trung Quốc, 1 cân là 500 gam, nửa cân là 250 gam, hai cân là 1 ki-lô-gam. Tôi muốn mua hai cân táo, 3 đồng rưỡi một cân, tổng cộng 7 đồng."],
